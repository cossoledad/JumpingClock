name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: windows-2022
            generator: Visual Studio 17 2022
          - image: windows-2025
            generator: Visual Studio 18 2026
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure x64
        run: cmake -S . -B build -G "${{ matrix.generator }}" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: JumpingClock-x64-${{ matrix.image }}
          path: build/Release/JumpingClock.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: JumpingClock-x64-windows-2022
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/JumpingClock.exe --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
